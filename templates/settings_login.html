<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DubLab · Settings</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>html.checking main{visibility:hidden}</style>
<script>
  // a remembered password goes straight on to the admin page — hide the form meanwhile
  try { if (localStorage.getItem('dublab_admin_key')) document.documentElement.classList.add('checking'); } catch (e) {}
</script>
</head>
<body>
<div class="orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
<header class="top">
  <a class="logo" href="/" title="DubLab — home">
    <img class="logo-mark" src="/static/img/logo.svg" alt="" width="44" height="44">
    <span class="logo-name">DubLab</span>
  </a>
  <p class="tagline">⚙️ admin · 💬 reviews</p>
  <a class="gear back" href="/" title="Back" aria-label="Back to DubLab">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
</header>
<main>
  <section class="card">
    <h2>⚙️ Settings</h2>
    <p class="note left">Admin password ထည့်ပါ (ဒီ browser မှာ မှတ်ထားမယ်)</p>
    <form class="urlrow" id="f">
      <input type="password" id="k" placeholder="Admin password" autocomplete="current-password" required autofocus>
      <button class="ghost" type="submit">ဝင်မယ်</button>
    </form>
    <p class="note left" id="err" hidden>Password မှားနေတယ်</p>
  </section>
</main>
<script>
const STORE = 'dublab_admin_key';
const get = () => { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } };
const set = (v) => { try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch (e) {} };
async function tryKey(k, quiet) {
  const r = await fetch('/admin/api/settings', { headers: { 'X-Admin-Key': k } }).catch(() => null);
  if (r && r.ok) { set(k); location.href = '/admin/reviews?key=' + encodeURIComponent(k); return; }
  set('');
  document.documentElement.classList.remove('checking');
  if (!quiet) document.getElementById('err').hidden = false;
}
if (get()) tryKey(get(), true);
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  tryKey(document.getElementById('k').value.trim(), false);
});
</script>
</body>
</html>
