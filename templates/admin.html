<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DubLab · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

<header class="top">
  <div class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round">
        <path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/>
      </svg>
    </span>
    <span class="logo-name">DubLab</span>
  </div>
  <p class="tagline">⚙️ admin · 💬 reviews</p>
</header>

<main>
  <section class="card">
    <h2>⚙️ Settings</h2>
    <label class="setrow" for="maxmin">
      <span>⏱️ ဗီဒီယို အရှည် အများဆုံး</span>
      <span class="setinput"><input type="number" id="maxmin" min="1" max="180" step="1" inputmode="numeric"> မိနစ်</span>
    </label>
    <label class="setcol" for="outroin">
      <span>📢 ဗီဒီယို အဆုံးမှာ ပြောမယ့်စာ <span class="dim">(အလွတ်ထားရင် မပြောဘူး)</span></span>
      <textarea id="outroin" rows="2" maxlength="200" placeholder="ဥပမာ — ကျွန်တော့်ရဲ့ channel လေးကို like and follow လေး လုပ်ခဲ့ပေးပါဦး"></textarea>
    </label>
    <div class="setcol">
      <span>🏷️ Channel logo <span class="dim">(နောက်ခံ ကြည်လင်တဲ့ PNG အကောင်းဆုံး)</span></span>
      <div class="logorow">
        <div class="logobox" id="logobox"><span class="dim" id="logonone">logo မရှိသေးဘူး</span><img id="logoimg" alt="logo" hidden></div>
        <div class="logobtns">
          <label class="mini filebtn">📤 ပုံတင်မယ်<input type="file" id="logofile" accept="image/png,image/jpeg,image/webp" hidden></label>
          <button class="mini" id="logodel" hidden>🗑️ ဖျက်မယ်</button>
        </div>
      </div>
    </div>
    <label class="setrow" for="logopos">
      <span>📍 Logo နေရာ</span>
      <select id="logopos" class="setselect">
        <option value="top-right">↗️ ညာ အပေါ်</option>
        <option value="top-left">↖️ ဘယ် အပေါ်</option>
        <option value="bottom-right">↘️ ညာ အောက်</option>
        <option value="bottom-left">↙️ ဘယ် အောက်</option>
      </select>
    </label>
    <label class="setrow" for="logosize">
      <span>📏 Logo အရွယ်အစား</span>
      <span class="setinput"><input type="range" id="logosize" min="5" max="30" step="1"> <b id="logosizev">12%</b></span>
    </label>
    <p class="note left" id="setnote">–</p>
    <button class="cta" id="setsave">💾 သိမ်းမယ်</button>
    <p class="note" id="setmsg" hidden></p>
  </section>

  <section class="card">
    <div class="statgrid" id="stats">
      <div class="stat"><span class="stat-num" id="st-total">–</span><span class="stat-label">reviews</span></div>
      <div class="stat"><span class="stat-num" id="st-avg">–</span><span class="stat-label">avg ⭐</span></div>
      <div class="stat"><span class="stat-num" id="st-5">–</span><span class="stat-label">5-star</span></div>
    </div>
    <div class="dist" id="dist"></div>
  </section>

  <section class="card">
    <div class="frow">
      <div class="filters" id="filters">
        <button data-f="all" class="on">အားလုံး</button>
        <button data-f="5">⭐5</button>
        <button data-f="4">⭐4</button>
        <button data-f="3">⭐3</button>
        <button data-f="2">⭐2</button>
        <button data-f="1">⭐1</button>
        <button data-f="msg">💬 စာပါ</button>
      </div>
      <button class="mini" id="refresh">🔄</button>
    </div>
    <div id="list"><p class="note">loading…</p></div>
  </section>
</main>

<footer>Made for creators · DubLab</footer>
<script src="/static/admin.js"></script>
</body>
</html>
